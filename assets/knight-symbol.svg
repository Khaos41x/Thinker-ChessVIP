<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" role="img" aria-labelledby="title description">
  <title id="title">Thinker Chess knight</title>
  <desc id="description">A symmetrical white chess knight with green eyes on a charcoal background.</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="47%" r="72%">
      <stop offset="0" stop-color="#2c2b28"/>
      <stop offset="1" stop-color="#252421"/>
    </radialGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf9f5"/>
      <stop offset="0.58" stop-color="#efede8"/>
      <stop offset="1" stop-color="#dfddd7"/>
    </linearGradient>
    <linearGradient id="facet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c7c6c0"/>
      <stop offset="1" stop-color="#969792"/>
    </linearGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16b77d"/>
      <stop offset="1" stop-color="#0b9f68"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="2" seed="19" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono">
        <feFuncA type="table" tableValues="0 0.045"/>
      </feComponentTransfer>
    </filter>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#171715" flood-opacity="0.28"/>
    </filter>
    <g id="knight-half">
      <path d="M627 247 571 272 557 304 546 329c-5-18-11-37-24-53l-14-22c-5 34-8 64 1 87l18 29-20 46 7 31-11 51 24 29-7 47c3 44-12 96-47 151l41 78h113Z" fill="url(#ivory)"/>
      <path d="M518 276c18 13 31 30 35 49l-15 27c-7-12-13-25-15-39Z" fill="#666762"/>
      <path d="m571 272-14 32 13 24h18Z" fill="url(#facet)"/>
      <path d="M529 372c18 7 36 16 52 26l17 42-28-32Z" fill="#bdbdb7"/>
      <path d="m536 443 37 19 7 31-27-5-12-12Z" fill="url(#eye)"/>
      <path d="m573 467 12 15 20 84-25-60Z" fill="#b1b2ad"/>
      <path d="M527 527c18 17 31 38 34 61 2 17-5 30-6 43-1 18 8 31 27 43 4 29 15 42 35 42h10" fill="none" stroke="#62635e" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M582 596c-12 10-14 26 17 40-5-20-10-33-17-40Z" fill="#5c5d58"/>
      <path d="M627 682h-44c6 13 17 20 34 20h10Z" fill="#b8b8b2"/>
      <path d="M627 713h-20c-13 0-22-4-28-12" fill="none" stroke="#62635e" stroke-width="8" stroke-linecap="round"/>
      <path d="m520 574 17 33c4 27-2 57-17 91l-47 27 41 78h38l-22-43 25-67c-17-18-24-37-24-58 0-19 6-37 6-53Z" fill="#c8c8c2" opacity="0.72"/>
      <path d="m514 704 16 56 22 43h-38l-28-53Z" fill="#b8b7b1"/>
    </g>
    <g id="base-half">
      <path d="M627 803H514v13h113Z" fill="#87857f"/>
      <path d="M627 816H509c-8 0-14 7-14 16s6 16 14 16h118Z" fill="#efeee9"/>
      <path d="M627 848H514c-8 21-29 39-62 52v34h175Z" fill="#eceae5"/>
      <path d="M627 945H450c-14 0-24 11-24 24v39h201Z" fill="url(#ivory)"/>
    </g>
  </defs>
  <rect width="1254" height="1254" fill="url(#background)"/>
  <rect width="1254" height="1254" fill="#ffffff" filter="url(#grain)" opacity="0.16"/>
  <g filter="url(#shadow)" transform="translate(0 -1)">
    <g>
      <use href="#knight-half"/>
      <use href="#knight-half" transform="translate(1254 0) scale(-1 1)"/>
    </g>
    <g>
      <use href="#base-half"/>
      <use href="#base-half" transform="translate(1254 0) scale(-1 1)"/>
    </g>
  </g>
</svg>
